<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0c1838"/>
      <stop offset="70%" stop-color="#050a15"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- 'C' Shape Gradient -->
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#002bb5"/>
    </linearGradient>

    <!-- 'P' Shape Gradient -->
    <linearGradient id="pGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e6e9f0"/>
      <stop offset="100%" stop-color="#808c9e"/>
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Emblem Base -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#0055ff" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00c8ff" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>

  <!-- Logo Mark Group -->
  <g transform="translate(0, -15)">
    <!-- The 'C' Shape -->
    <path d="M 265 110 
             C 175 110 115 175 115 255 
             C 115 335 175 400 265 400 
             C 295 400 320 390 345 375 
             L 305 325 
             C 290 335 275 340 260 340 
             C 205 340 180 300 180 255 
             C 180 210 205 170 260 170 
             C 275 170 290 175 305 185 
             L 345 135 
             C 320 120 295 110 265 110 Z" 
          fill="url(#cGrad)" 
          filter="url(#dropShadow)"/>

    <!-- The 'P' Shape -->
    <path d="M 220 180 
             L 320 180 
             C 375 180 375 255 320 255 
             L 270 255 
             L 270 300 
             L 225 340 
             L 225 180 Z 
             M 270 205 
             L 270 230 
             L 310 230 
             C 330 230 330 205 310 205 
             L 270 205 Z" 
          fill="url(#pGrad)" 
          fill-rule="evenodd" 
          filter="url(#dropShadow)"/>

    <!-- Digital Pixels / Squares -->
    <g fill="#00d4ff" filter="url(#neonGlow)">
      <rect x="325" y="145" width="22" height="22" />
      <rect x="312" y="172" width="14" height="14" />
      <rect x="352" y="175" width="28" height="28" />
      <rect x="388" y="165" width="12" height="12" />
      <rect x="360" y="210" width="16" height="16" />
      <rect x="385" y="195" width="10" height="10" />
    </g>
  </g>

  <!-- Typography: Company Name -->
  <text x="256" y="380" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="1.5">
    <tspan fill="#ffffff">CYBER</tspan><tspan fill="#00c8ff">POINTAK</tspan>
  </text>

  <!-- Typography: Tagline -->
  <text x="256" y="415" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="4" fill="#ffffff" opacity="0.9">
    YOUR DIGITAL SERVICE PARTNER
  </text>

  <!-- Tagline Accents -->
  <line x1="85" y1="411" x2="115" y2="411" stroke="#00c8ff" stroke-width="1.5" />
  <line x1="397" y1="411" x2="427" y2="411" stroke="#00c8ff" stroke-width="1.5" />
</svg>
